<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 720 405" role="img" aria-labelledby="title desc">
<title id="title">Example slide layout</title>
<desc id="desc">An original schematic layout showing the section at top left, a centered heading, a large editable workflow concept, a short takeaway and a source line. No experimental data.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#000000"/></marker></defs>
<rect width="720" height="405" fill="#FFFFFF"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#000000">
<text x="12" y="21" font-size="14" font-weight="bold">Methods</text>
<text x="360" y="50" text-anchor="middle" font-size="20" font-weight="bold">Analysis workflow</text>
<text x="360" y="107" text-anchor="middle" font-size="16">A schematic of the processing order</text>
<g fill="#FFFFFF" stroke-width="1.2">
<rect x="51" y="160" width="158" height="68" stroke="#000000"/>
<rect x="281" y="160" width="158" height="68" stroke="#C00000" stroke-width="2"/>
<rect x="511" y="160" width="158" height="68" stroke="#000000"/>
</g>
<g stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)">
<line x1="209" y1="194" x2="272" y2="194"/>
<line x1="439" y1="194" x2="502" y2="194"/>
</g>
<text x="130" y="201" text-anchor="middle" font-size="20">Input data</text>
<text x="360" y="201" text-anchor="middle" font-size="20" fill="#C00000">Processing</text>
<text x="590" y="201" text-anchor="middle" font-size="20">Output</text>
<text x="130" y="266" text-anchor="middle" font-size="16">Observed variables</text>
<text x="360" y="266" text-anchor="middle" font-size="16">Specified operations</text>
<text x="590" y="266" text-anchor="middle" font-size="16">Evaluation measures</text>
<text x="360" y="363" text-anchor="middle" font-size="18" font-weight="bold">Each step has a defined input and output</text>
<text x="24" y="390" font-size="9">Original layout example   Schematic only</text>
<text x="704" y="390" font-size="9" text-anchor="end">1</text>
</g>
</svg>
